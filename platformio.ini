; ESP32 Astro Focuser – PlatformIO Project Configuration
; Target: ESP32-WROOM-32 Dev Board (generic)
; Framework: Arduino
; Note: After any config change that affects lib_deps, run "PIO: Clean"
;       first time: also run "Upload Filesystem Image" to populate LittleFS

[platformio]
default_envs = esp32dev

[env:esp32dev]
platform    = espressif32 @ ^6.9.0
board       = esp32dev
framework   = arduino

; Serial monitor
monitor_speed   = 115200
monitor_filters = esp32_exception_decoder

; LittleFS for web assets and Alpaca settings
board_build.filesystem = littlefs

; Build flags
build_flags =
    -D ELEGANTOTA_USE_ASYNC_WEBSERVER=1
    -D CONFIG_ASYNC_TCP_RUNNING_CORE=1
    -D FIRMWARE_VERSION=\"1.0.0\"
    -D CORE_DEBUG_LEVEL=3
    ; Silence Arduino String deprecation warnings from dependencies
    -Wno-deprecated-declarations

; Library dependencies (pinned for reproducibility)
; ESPAsyncWebServer is pinned to 3.9.0 because later 3.x releases changed
; WebRequestMethodComposite from a uint8_t typedef to a scoped enum class,
; which breaks ESP32AlpacaDevices' internal AlpacaDebug.h / AlpacaServer.cpp.
lib_deps =
    https://github.com/npeter/ESP32AlpacaDevices2
    ESP32Async/ESPAsyncWebServer @ 3.9.0
    olikraus/U8g2 @ ^2.35.30
    waspinator/AccelStepper @ ^1.64
    paulstoffregen/OneWire @ ^2.3.8
    milesburton/DallasTemperature @ ^3.11.0

; Merge ESP32AlpacaDevices library web assets into our LittleFS image
extra_scripts = scripts/merge_fs_data.py

; Upload settings
upload_speed = 921600
